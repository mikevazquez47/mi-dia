<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#005252"><title>mi día</title><style>:root{--deep:#005252;--ink:#35425f;--cream:#fff5f2;--gold:#f0a019;--sage:#d8e2db;--blue:#08738d;--rose:#dd8582}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{display:flex;min-height:100vh}.side{width:250px;background:var(--deep);color:white;padding:28px 16px}.brand{font-size:30px;font-weight:800;padding:0 12px 25px}.brand i{color:var(--gold);font-style:normal}.nav button,.mobile button{border:0;background:transparent;color:#d9ece6;padding:12px;border-radius:12px;font-weight:700;text-align:left;width:100%;font-size:15px}.nav button.active,.nav button:hover{background:#ffffff22;color:#fff}.note{margin-top:30px;background:#ffffff16;border-radius:14px;padding:14px;font-size:12px;line-height:1.5}.main{flex:1;max-width:1100px;padding:34px clamp(18px,5vw,60px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:800}.h1{font-size:38px;font-weight:800;letter-spacing:-1px;margin-top:5px}.avatar{background:var(--gold);color:var(--deep);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 6;background:white;border-radius:22px;padding:22px;box-shadow:0 10px 25px #35425f15}.full{grid-column:1/-1}.third{grid-column:span 4}.hero{background:var(--deep);color:white;display:flex;justify-content:space-between}.hero p{color:#d7ebe4}.sun{font-size:60px;color:var(--gold)}h2{margin:0 0 8px}.muted{color:#687389}.stat{font-size:30px;font-weight:800;color:var(--deep);margin:8px 0}.progress{height:9px;background:var(--sage);border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f1;gap:10px}.check{border:0;background:var(--sage);border-radius:9px;width:30px;height:30px;color:var(--deep);font-weight:900;margin-right:10px}.check.done{background:var(--deep);color:white}.btn{border:0;border-radius:11px;background:var(--deep);color:white;padding:11px 15px;font-weight:750;margin-top:14px}.secondary{background:var(--sage);color:var(--deep)}.danger{background:#f8dddd;color:#8b4847}.pill{background:var(--sage);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}.form{display:grid;gap:12px;margin-top:15px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #cbd5d8;border-radius:10px;font:inherit;background:white}.form textarea{min-height:75px}.mobile{display:none}.empty{padding:20px;text-align:center;color:#687389}@media(max-width:760px){.side{display:none}.main{padding:23px 16px 88px}.h1{font-size:30px}.card,.third{grid-column:1/-1;padding:19px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -5px 20px #35425f18;z-index:4;padding:7px 3px}.mobile button{color:#687389;text-align:center;font-size:10px;padding:5px}.mobile button.active{color:var(--deep)}.mobile span{display:block;font-size:19px}}</style></head><body><div class="app"><aside class="side"><div class="brand">mi <i>día</i></div><div class="nav" id="nav"></div><div class="note"><b>Datos locales</b><br>Todo lo que registres se guarda sólo en este dispositivo.</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="date"></div><div class="h1">Hola, Marco 👋</div></div><div class="avatar">MV</div></header><section id="view"></section></main></div><nav class="mobile" id="mobile"></nav><script>var pages=[['hoy','☀','Hoy'],['registrar','✍','Registrar'],['hábitos','✓','Hábitos'],['entrenamiento','🏋','Entreno'],['finanzas','◈','Finanzas'],['salud','♡','Salud'],['metas','◎','Metas'],['historial','▤','Historial']];var st=JSON.parse(localStorage.getItem('mi-dia-real')||'null')||{page:'hoy',habits:[{name:'Tomar agua',done:true},{name:'Caminar 6,000 pasos',done:false},{name:'Pausa consciente',done:false}],goals:[{name:'Moverme con constancia',progress:42}],expenses:[],moods:[],sessions:[]};function save(){localStorage.setItem('mi-dia-real',JSON.stringify(st))}function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function menu(){var x='';pages.forEach(function(p){x+='<button class="'+(st.page==p[0]?'active':'')+'" data-page="'+p[0]+'"><span>'+p[1]+'</span>'+p[2]+'</button>'});document.getElementById('nav').innerHTML=x;document.getElementById('mobile').innerHTML=x}function card(t,b,c){return '<article class="card '+(c||'')+'"><h2>'+t+'</h2>'+b+'</article>'}function habitRows(){var x='';st.habits.forEach(function(h,i){x+='<div class="row"><span><button class="check '+(h.done?'done':'')+'" data-habit="'+i+'">'+(h.done?'✓':'')+'</button>'+esc(h.name)+'</span><span class="pill">'+(h.done?'Listo':'Pendiente')+'</span></div>'});return x}function render(){menu();var v='';if(st.page=='hoy'){var pending=st.habits.filter(function(h){return !h.done}).length;var total=st.expenses.reduce(function(a,e){return a+Number(e.amount)},0);v='<div class="grid"><article class="card hero full"><div><div class="eyebrow" style="color:#f0a019">Tu resumen</div><h2>Un paso a la vez</h2><p>Te quedan '+pending+' hábitos por completar.</p></div><div class="sun">☀</div></article>'+card('Hábitos de hoy',habitRows(),'full')+card('Gastos de hoy','<div class="stat">$'+total.toFixed(2)+'</div><p class="muted">'+st.expenses.length+' movimientos registrados</p><button class="btn" data-page="finanzas">Ver finanzas</button>','third')+card('Tu energía','<div class="stat">'+(st.moods.length?'Registrada':'Sin registrar')+'</div><p class="muted">Tomarte un minuto también cuenta.</p><button class="btn secondary" data-page="salud">Registrar estado</button>','third')+card('Meta en foco','<div class="stat">'+(st.goals[0]?st.goals[0].progress:0)+'%</div><div class="progress"><b style="width:'+(st.goals[0]?st.goals[0].progress:0)+'%"></b></div><p class="muted">'+(st.goals[0]?esc(st.goals[0].name):'Crea tu primera meta')+'</p>','third')+'</div>'}else if(st.page=='registrar'){v='<div class="grid">'+card('Registrar algo nuevo','<form class="form" id="quickForm"><label>Tipo<select name="type"><option value="expense">Gasto</option><option value="mood">Estado de ánimo</option><option value="workout">Entrenamiento</option></select></label><label>Detalle<input name="detail" required placeholder="Ej. comida, sesión, cómo me sentí"></label><label>Monto (opcional)<input name="amount" type="number" step="0.01" min="0" placeholder="0.00"></label><button class="btn">Guardar registro</button></form>','full')+'</div>'}else if(st.page=='hábitos'){v='<div class="grid">'+card('Mis hábitos','<p class="muted">Agrega tus propias acciones y márcalas al cumplirlas.</p>'+habitRows()+'<form class="form" id="habitForm"><label>Nuevo hábito<input name="name" required placeholder="Ej. Leer 10 minutos"></label><button class="btn">Agregar hábito</button></form>','full')+card('Progreso','<div class="stat">'+st.habits.filter(function(h){return h.done}).length+'/'+st.habits.length+'</div><span class="muted">completados hoy</span>','third')+'</div>'}else if(st.page=='finanzas'){var rows=st.expenses.length?'':'<div class="empty">Aún no hay gastos registrados.</div>';st.expenses.slice().reverse().forEach(function(e,i){rows+='<div class="row"><span><b>$'+Number(e.amount).toFixed(2)+'</b><br><span class="muted">'+esc(e.detail)+'</span></span><button class="btn danger" data-delete-expense="'+(st.expenses.length-1-i)+'">Eliminar</button></div>'});v='<div class="grid">'+card('Finanzas','<div class="stat">$'+st.expenses.reduce(function(a,e){return a+Number(e.amount)},0).toFixed(2)+'</div><p class="muted">Total registrado</p><form class="form" id="expenseForm"><label>Monto<input name="amount" type="number" step="0.01" min="0" required placeholder="0.00"></label><label>¿En qué fue?<input name="detail" required placeholder="Ej. comida, transporte"></label><button class="btn">Guardar gasto</button></form>','full')+card('Movimientos',rows,'full')+'</div>'}else if(st.page=='metas'){var gs='';st.goals.forEach(function(g,i){gs+='<div class="row"><span><b>'+esc(g.name)+'</b><br><span class="muted">'+g.progress+'% completada</span><div class="progress"><b style="width:'+g.progress+'%"></b></div></span><button class="btn secondary" data-goal="'+i+'">+10%</button></div>'});v='<div class="grid">'+card('Mis metas',gs+'<form class="form" id="goalForm"><label>Nombre de la meta<input name="name" required placeholder="Ej. Ahorrar para vacaciones"></label><button class="btn">Crear meta</button></form>','full')+'</div>'}else if(st.page=='salud'){v='<div class="grid">'+card('Salud mental','<p class="muted">Un espacio breve para escucharte, sin juicio.</p><form class="form" id="moodForm"><label>¿Cómo estuvo tu día?<select name="mood"><option>✨ Muy bien</option><option>🙂 Bien</option><option>😐 Neutro</option><option>🌧️ Difícil</option></select></label><label>Una frase corta<textarea name="detail" required placeholder="Hoy me sentí…"></textarea></label><button class="btn">Guardar check-in</button></form>','full')+'</div>'}else if(st.page=='entrenamiento'){v='<div class="grid">'+card('Movimiento de hoy','<p><b>Sesión libre · 20 min</b></p><p class="muted">Registra cuando termines.</p><button class="btn" data-session>Guardar sesión completada</button>','full')+card('Esta semana','<div class="stat">'+st.sessions.length+' sesiones</div><div class="progress"><b style="width:'+Math.min(100,st.sessions.length*33)+'%"></b></div>','third')+'</div>'}else if(st.page=='historial'){var h='';st.expenses.forEach(function(e){h+='<div class="row"><span class="pill">Gasto</span><span>$'+Number(e.amount).toFixed(2)+' · '+esc(e.detail)+'</span></div>'});st.moods.forEach(function(m){h+='<div class="row"><span class="pill">Ánimo</span><span>'+esc(m.mood)+' · '+esc(m.detail)+'</span></div>'});st.sessions.forEach(function(){h+='<div class="row"><span class="pill">Entrenamiento</span><span>Sesión completada</span></div>'});v='<div class="grid">'+card('Historial',h||'<div class="empty">Todavía no hay registros.</div>','full')+'</div>'}document.getElementById('view').innerHTML=v}document.addEventListener('click',function(e){var p=e.target.closest('[data-page]');if(p){st.page=p.getAttribute('data-page');save();render()}var h=e.target.closest('[data-habit]');if(h){st.habits[+h.getAttribute('data-habit')].done=!st.habits[+h.getAttribute('data-habit')].done;save();render()}var g=e.target.closest('[data-goal]');if(g){st.goals[+g.getAttribute('data-goal')].progress=Math.min(100,st.goals[+g.getAttribute('data-goal')].progress+10);save();render()}var de=e.target.closest('[data-delete-expense]');if(de){st.expenses.splice(+de.getAttribute('data-delete-expense'),1);save();render()}if(e.target.hasAttribute('data-session')){st.sessions.push({date:Date.now()});save();render()}});document.addEventListener('submit',function(e){e.preventDefault();var f=e.target,d=new FormData(f);if(f.id=='goalForm')st.goals.push({name:d.get('name'),progress:0});if(f.id=='habitForm')st.habits.push({name:d.get('name'),done:false});if(f.id=='expenseForm')st.expenses.push({amount:d.get('amount'),detail:d.get('detail'),date:Date.now()});if(f.id=='moodForm')st.moods.push({mood:d.get('mood'),detail:d.get('detail'),date:Date.now()});if(f.id=='quickForm'){if(d.get('type')=='expense')st.expenses.push({amount:d.get('amount')||0,detail:d.get('detail'),date:Date.now()});else if(d.get('type')=='mood')st.moods.push({mood:'📝 Nota',detail:d.get('detail'),date:Date.now()});else st.sessions.push({date:Date.now()})}save();render()});document.getElementById('date').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});render();</script></body></html>
