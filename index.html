<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#005252"><title>mi día</title><style>:root{--deep:#005252;--ink:#35425f;--cream:#fff5f2;--gold:#f0a019;--sage:#d8e2db;--blue:#08738d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{display:flex;min-height:100vh}.side{width:250px;background:var(--deep);color:white;padding:28px 16px}.brand{font-size:30px;font-weight:800;padding:0 12px 25px}.brand i{color:var(--gold);font-style:normal}.nav button,.mobile button{border:0;background:transparent;color:#d9ece6;padding:12px;border-radius:12px;font-weight:700;text-align:left;width:100%;font-size:15px}.nav button.active,.nav button:hover{background:#ffffff22;color:#fff}.note{margin-top:30px;background:#ffffff16;border-radius:14px;padding:14px;font-size:12px;line-height:1.5}.main{flex:1;max-width:1100px;padding:34px clamp(18px,5vw,60px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:800}.h1{font-size:38px;font-weight:800;letter-spacing:-1px;margin-top:5px}.avatar{background:var(--gold);color:var(--deep);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 6;background:white;border-radius:22px;padding:22px;box-shadow:0 10px 25px #35425f15}.full{grid-column:1/-1}.third{grid-column:span 4}.hero{background:var(--deep);color:white;display:flex;justify-content:space-between}.hero p{color:#d7ebe4}.sun{font-size:60px;color:var(--gold)}h2{margin:0 0 8px}.muted{color:#687389}.stat{font-size:30px;font-weight:800;color:var(--deep);margin:8px 0}.progress{height:9px;background:var(--sage);border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f1}.check{border:0;background:var(--sage);border-radius:9px;width:30px;height:30px;color:var(--deep);font-weight:900;margin-right:10px}.check.done{background:var(--deep);color:white}.btn{border:0;border-radius:11px;background:var(--deep);color:white;padding:11px 15px;font-weight:750;margin-top:14px}.secondary{background:var(--sage);color:var(--deep)}.mobile{display:none}.pill{background:var(--sage);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}@media(max-width:760px){.side{display:none}.main{padding:23px 16px 88px}.h1{font-size:30px}.card,.third{grid-column:1/-1;padding:19px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -5px 20px #35425f18;z-index:4;padding:7px 3px}.mobile button{color:#687389;text-align:center;font-size:10px;padding:5px}.mobile button.active{color:var(--deep)}.mobile span{display:block;font-size:19px}}</style></head><body><div class="app"><aside class="side"><div class="brand">mi <i>día</i></div><div class="nav" id="nav"></div><div class="note"><b>Vista previa</b><br>Demo local. Tus cambios se guardan sólo en este dispositivo.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">lunes, 31 de agosto</div><div class="h1">Hola, Marco 👋</div></div><div class="avatar">MV</div></header><section id="view"></section></main></div><nav class="mobile" id="mobile"></nav><script>var pages=[['hoy','☀','Hoy'],['hábitos','✓','Hábitos'],['entrenamiento','🏋','Entreno'],['salud','♡','Salud'],['metas','◎','Metas']];var st=JSON.parse(localStorage.getItem('mi-dia')||'null')||{page:'hoy',done:[1,0,0],sessions:0,goal:42};function save(){localStorage.setItem('mi-dia',JSON.stringify(st))}function menu(){var x='';pages.forEach(function(p){x+='<button class="'+(st.page==p[0]?'active':'')+'" data-page="'+p[0]+'"><span>'+p[1]+'</span>'+p[2]+'</button>'});document.getElementById('nav').innerHTML=x;document.getElementById('mobile').innerHTML=x}function card(t,b,c){return '<article class="card '+(c||'')+'"><h2>'+t+'</h2>'+b+'</article>'}function render(){menu();var v='';if(st.page=='hoy')v='<div class="grid"><article class="card hero full"><div><div class="eyebrow" style="color:#f0a019">Tu resumen</div><h2>Un paso a la vez</h2><p>Hoy tienes '+(st.done.filter(function(x){return !x}).length)+' hábitos por completar.</p></div><div class="sun">☀</div></article>'+card('Hábitos de hoy','<div class="row"><span><button class="check done" data-check="0">✓</button>Tomar agua</span><span class="pill">Listo</span></div><div class="row"><span><button class="check" data-check="1"></button>Caminar 6,000 pasos</span><span class="pill">Pendiente</span></div><div class="row"><span><button class="check" data-check="2"></button>Pausa consciente</span><span class="pill">Pendiente</span></div>','full')+card('Tu energía','<div class="stat">¿Cómo te sientes?</div><p class="muted">Tomarte un minuto también cuenta.</p>','third')+card('Próximo movimiento','<b>Sesión libre</b><p class="muted">Elige cuándo moverte hoy</p>','third')+card('Meta en foco','<div class="stat">'+st.goal+'%</div><div class="progress"><b style="width:'+st.goal+'%"></b></div><p class="muted">Moverme con constancia</p>','third')+'</div>';else if(st.page=='hábitos')v='<div class="grid">'+card('Mis hábitos','<p class="muted">Pequeñas acciones, días más tuyos.</p><div class="row">Tomar agua <button class="check done" data-check="0">✓</button></div><div class="row">Caminar 6,000 pasos <button class="check" data-check="1"></button></div><div class="row">Pausa consciente <button class="check" data-check="2"></button></div>','full')+card('Racha','<div class="stat">'+st.done.filter(Boolean).length+'/3</div><span class="muted">completados hoy</span>','third')+'</div>';else if(st.page=='entrenamiento')v='<div class="grid">'+card('Movimiento de hoy','<p><b>Sesión suave · 20 min</b></p><p class="muted">Movilidad y fuerza funcional</p><button class="btn" data-session>Marcar como hecha</button>','full')+card('Esta semana','<div class="stat">'+st.sessions+' sesiones</div><div class="progress"><b style="width:'+(st.sessions*33)+'%"></b></div>','third')+'</div>';else if(st.page=='salud')v='<div class="grid">'+card('Salud mental','<p class="muted">Un espacio breve para escucharte, sin juicio.</p><p>¿Cómo estuvo tu día?</p><button class="btn secondary">✨ Muy bien</button> <button class="btn">🙂 Bien</button><p><button class="btn">Guardar check-in</button></p>','full')+'</div>';else v='<div class="grid">'+card(st.page=='metas'?'Metas':'Próximamente','<p class="muted">Este módulo está listo para seguir creciendo.</p><button class="btn" data-home>Volver a Hoy</button>','full')+'</div>';document.getElementById('view').innerHTML=v}document.addEventListener('click',function(e){var p=e.target.closest('[data-page]');if(p){st.page=p.getAttribute('data-page');save();render()}var c=e.target.closest('[data-check]');if(c){var i=+c.getAttribute('data-check');st.done[i]=st.done[i]?0:1;save();render()}if(e.target.hasAttribute('data-session')){st.sessions++;save();render()}if(e.target.hasAttribute('data-home')){st.page='hoy';save();render()}});render();</script></body></html>
