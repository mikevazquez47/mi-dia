<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#005252"><title>mi día</title><style>:root{--deep:#005252;--ink:#35425f;--cream:#fff5f2;--gold:#f0a019;--sage:#d8e2db;--blue:#08738d;--rose:#dd8582}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{display:flex;min-height:100vh}.side{width:250px;background:var(--deep);color:white;padding:28px 16px}.brand{font-size:30px;font-weight:800;padding:0 12px 25px}.brand i{color:var(--gold);font-style:normal}.nav button,.mobile button{border:0;background:transparent;color:#d9ece6;padding:12px;border-radius:12px;font-weight:700;text-align:left;width:100%;font-size:15px}.nav button.active,.nav button:hover{background:#ffffff22;color:#fff}.note{margin-top:30px;background:#ffffff16;border-radius:14px;padding:14px;font-size:12px;line-height:1.5}.main{flex:1;max-width:1100px;padding:34px clamp(18px,5vw,60px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:800}.h1{font-size:38px;font-weight:800;letter-spacing:-1px;margin-top:5px}.avatar{background:var(--gold);color:var(--deep);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 6;background:white;border-radius:22px;padding:22px;box-shadow:0 10px 25px #35425f15}.full{grid-column:1/-1}.third{grid-column:span 4}.hero{background:var(--deep);color:white;display:flex;justify-content:space-between}.hero p{color:#d7ebe4}.sun{font-size:60px;color:var(--gold)}h2{margin:0 0 8px}.muted{color:#687389}.stat{font-size:30px;font-weight:800;color:var(--deep);margin:8px 0}.progress{height:9px;background:var(--sage);border-radius:9px;overflow:hidden}.progress b{display:block;height:100%;background:var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f1;gap:10px}.check{border:0;background:var(--sage);border-radius:9px;width:30px;height:30px;color:var(--deep);font-weight:900;margin-right:10px}.check.done{background:var(--deep);color:white}.btn{border:0;border-radius:11px;background:var(--deep);color:white;padding:11px 15px;font-weight:750;margin-top:14px}.secondary{background:var(--sage);color:var(--deep)}.danger{background:#f8dddd;color:#8b4847}.pill{background:var(--sage);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}.form{display:grid;gap:12px;margin-top:15px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #cbd5d8;border-radius:10px;font:inherit;background:white}.form textarea{min-height:75px}.mobile{display:none}.empty{padding:20px;text-align:center;color:#687389}@media(max-width:760px){.side{display:none}.main{padding:23px 16px 88px}.h1{font-size:30px}.card,.third{grid-column:1/-1;padding:19px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -5px 20px #35425f18;z-index:4;padding:7px 3px}.mobile button{color:#687389;text-align:center;font-size:10px;padding:5px}.mobile button.active{color:var(--deep)}.mobile span{display:block;font-size:19px}}.reportstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.reportstat{background:#fff5f2;border-radius:12px;padding:12px}.reportstat small{display:block;color:#687389;font-size:11px}.reportstat b{display:block;color:#005252;font-size:19px;margin-top:4px}@media(max-width:760px){.reportstats{grid-template-columns:1fr 1fr}.reportstat:last-child{grid-column:1/-1}}.goal{border:1px solid #edf0f1;border-radius:16px;padding:15px;margin:12px 0}.goalhead{display:flex;justify-content:space-between;gap:12px;align-items:start}.goalname{font-size:17px;font-weight:800}.goalmeta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.goaldate{font-size:12px;color:#687389}.goalform{background:#fffaf8;border-radius:16px;padding:16px;margin-top:18px}.goalform h3{margin:0 0 12px}.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goalgrid label{font-size:12px}.goalgrid label:first-child{grid-column:1/-1}@media(max-width:760px){.goalgrid{grid-template-columns:1fr}}@media(max-width:760px){.row{flex-wrap:wrap;gap:8px}.row>span:first-child{min-width:0;flex:1}.row>span:last-child{width:100%;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:5px}.today-habit>span:last-child{width:auto}.btn{max-width:100%}}.pill.pending{background:#fff0d6;color:#9a6500;border:1px solid #f3d59b}.today-habit{padding:15px 0}.today-habit .check{flex:0 0 auto}</style></head><body><div class="app"><aside class="side"><div class="brand">mi <i>día</i></div><div class="nav" id="nav"></div><div class="note"><b>Datos locales</b><br>Todo lo que registres se guarda sólo en este dispositivo.</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="date"></div><div class="h1">Hola, Marco 👋</div></div><div class="avatar">MV</div></header><section id="view"></section></main></div><nav class="mobile" id="mobile"></nav><script>var pages=[['hoy','☀','Hoy'],['registrar','✍','Registrar'],['hábitos','✓','Hábitos'],['entrenamiento','🏋','Entreno'],['finanzas','◈','Finanzas'],['salud','♡','Salud'],['metas','◎','Metas'],['historial','▤','Historial']];var st=JSON.parse(localStorage.getItem('mi-dia-real')||'null')||{page:'hoy',habits:[{name:'Tomar agua',done:true},{name:'Caminar 6,000 pasos',done:false},{name:'Pausa consciente',done:false}],goals:[{name:'Moverme con constancia',progress:42}],expenses:[],moods:[],sessions:[],accounts:[],recurring:[]};if(!st.accounts)st.accounts=[];if(!st.recurring)st.recurring=[];function save(){localStorage.setItem('mi-dia-real',JSON.stringify(st))}function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function menu(){var x='';pages.forEach(function(p){x+='<button class="'+(st.page==p[0]?'active':'')+'" data-page="'+p[0]+'"><span>'+p[1]+'</span>'+p[2]+'</button>'});document.getElementById('nav').innerHTML=x;document.getElementById('mobile').innerHTML=x}function card(t,b,c){return '<article class="card '+(c||'')+'"><h2>'+t+'</h2>'+b+'</article>'}function dayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function habitRows(){var x='';st.habits.forEach(function(h,i){var done=h.doneDate==dayKey()||(h.done===true&&!h.doneDate);x+='<div class=\"row\"><span><button class=\"check '+(done?'done':'')+'\" data-habit=\"'+i+'\">'+(done?'✓':'')+'</button>'+esc(h.name)+'</span><span><span class=\"pill '+(done?'':'pending')+'\">'+(done?'Listo':'Pendiente')+'</span> <button class=\"btn secondary\" data-edit-habit=\"'+i+'\">Editar</button> <button class=\"btn danger\" data-delete-habit=\"'+i+'\">Eliminar</button></span></div>'});return x||'<div class=\"empty\">Aún no hay hábitos configurados.</div>'}function todayHabitRows(){var x='';st.habits.forEach(function(h,i){var done=h.doneDate==dayKey()||(h.done===true&&!h.doneDate);x+='<div class=\"row today-habit\"><span><button class=\"check '+(done?'done':'')+'\" data-habit=\"'+i+'\">'+(done?'✓':'')+'</button>'+esc(h.name)+'</span><span class=\"pill '+(done?'':'pending')+'\">'+(done?'Realizado':'Pendiente')+'</span></div>'});return x||'<div class=\"empty\">No hay hábitos configurados.</div>'}function render(){menu();var v='';if(st.page=='hoy'){var pending=st.habits.filter(function(h){return h.doneDate!=dayKey()&&h.done!==true}).length;var total=st.expenses.filter(function(e){return e.type!='income'}).reduce(function(a,e){return a+Number(e.amount)},0);v='<div class="grid"><article class="card hero full"><div><div class="eyebrow" style="color:#f0a019">Tu resumen</div><h2>Un paso a la vez</h2><p>Te quedan '+pending+' hábitos por completar.</p></div><div class="sun">☀</div></article>'+card('Hábitos de hoy',todayHabitRows(),'full')+card('Gastos de hoy','<div class="stat">$'+total.toFixed(2)+'</div><p class="muted">'+st.expenses.length+' movimientos registrados</p><button class="btn" data-page="finanzas">Ver finanzas</button>','third')+card('Tu energía','<div class="stat">'+(st.moods.length?'Registrada':'Sin registrar')+'</div><p class="muted">Tomarte un minuto también cuenta.</p><button class="btn secondary" data-page="salud">Registrar estado</button>','third')+card('Meta en foco','<div class="stat">'+(st.goals[0]?st.goals[0].progress:0)+'%</div><div class="progress"><b style="width:'+(st.goals[0]?st.goals[0].progress:0)+'%"></b></div><p class="muted">'+(st.goals[0]?esc(st.goals[0].name):'Crea tu primera meta')+'</p>','third')+'</div>'}else if(st.page=='registrar'){v='<div class="grid">'+card('Registrar algo nuevo','<form class="form" id="quickForm"><label>Tipo<select name="type"><option value="expense">Gasto</option><option value="mood">Estado de ánimo</option><option value="workout">Entrenamiento</option></select></label><label>Detalle<input name="detail" required placeholder="Ej. comida, sesión, cómo me sentí"></label><label>Monto (opcional)<input name="amount" type="number" step="0.01" min="0" placeholder="0.00"></label><button class="btn">Guardar registro</button></form>','full')+'</div>'}else if(st.page=='hábitos'){v='<div class="grid">'+card('Mis hábitos','<p class="muted">Agrega tus propias acciones y márcalas al cumplirlas.</p>'+habitRows()+'<form class="form" id="habitForm"><label>Nuevo hábito<input name="name" required placeholder="Ej. Leer 10 minutos"></label><button class="btn">Agregar hábito</button></form>','full')+card('Progreso','<div class="stat">'+st.habits.filter(function(h){return h.doneDate==dayKey()||(h.done===true&&!h.doneDate)}).length+'/'+st.habits.length+'</div><span class="muted">completados hoy</span>','third')+'</div>'}else if(st.page=='finanzas'){var inc=st.expenses.filter(function(e){return e.type=='income'}).reduce(function(a,e){return a+Number(e.amount)},0),out=st.expenses.filter(function(e){return e.type!='income'}).reduce(function(a,e){return a+Number(e.amount)},0),rows=st.expenses.length?'':'<div class=\"empty\">Aún no hay movimientos registrados.</div>';st.expenses.slice().reverse().forEach(function(e,i){var sign=e.type=='income'?'+':'−';rows+='<div class=\"row\"><span><b>'+sign+' $'+Number(e.amount).toFixed(2)+'</b><br><span class=\"muted\">'+esc(e.category||'Otros')+' · '+esc(e.detail||'Sin detalle')+' · '+(e.recurrence=='recurrente'?'Recurrente':'Pago único')+' · '+esc(st.accounts[e.account]?st.accounts[e.account].name:'Sin cuenta')+' · '+(typeof e.date=='string'?e.date:new Date(e.date||Date.now()).toLocaleDateString('es-MX'))+'</span></span><button class=\"btn secondary\" data-edit-expense=\"'+(st.expenses.length-1-i)+'\">Editar</button><button class=\"btn danger\" data-delete-expense=\"'+(st.expenses.length-1-i)+'\">Eliminar</button></div>'});v='<div class=\"grid\">'+card('Finanzas','<div class=\"reportstats\"><div class=\"reportstat\"><small>Ingresos</small><b>$'+inc.toFixed(2)+'</b></div><div class=\"reportstat\"><small>Gastos</small><b>$'+out.toFixed(2)+'</b></div><div class=\"reportstat\"><small>Balance</small><b>$'+(inc-out).toFixed(2)+'</b></div></div><form class=\"form goalform\" id=\"expenseForm\"><h3>Nuevo movimiento</h3><label>Tipo<select name=\"type\" onchange=\"movementKind(this.value)\"><option value=\"expense\">Gasto</option><option value=\"income\">Ingreso</option></select></label><label id=\"groupWrap\">Categoría principal<select name=\"group\"><option>Gasto fijo</option><option>Gasto variable</option><option>Gasto no indispensable</option></select></label><label id=\"categoryLabel\">Subcategoría · ¿Hacia dónde va?</label><select id=\"movementCategory\" name=\"category\">'+categoryOptions('expense')+'</select><label>Monto<input name=\"amount\" type=\"number\" step=\"0.01\" min=\"0\" required placeholder=\"0.00\"></label><label>Detalle<input name=\"detail\" required placeholder=\"Ej. súper, gasolina, pago…\"></label><label>Cuenta<select name=\"account\" required>'+accountOptions()+'</select></label><label>Fecha<input name=\"date\" type=\"date\"></label><label>Tipo de pago<select name=\"recurrence\" onchange=\"toggleRecurrence(this.value)\"><option value=\"unico\">Pago único</option><option value=\"recurrente\">Recurrente</option></select></label><label id=\"recurrenceWrap\" style=\"display:none\">Día habitual de pago<input name=\"payday\" type=\"number\" min=\"1\" max=\"31\" placeholder=\"Ej. 1\"></label><button class=\"btn\">Guardar movimiento</button></form>','full')+card('Próximos pagos e ingresos',pendingRecurring(),'full')+card('Movimientos',rows,'full')+card('Reporte','<div id=\"report\">'+report('month')+'</div>','full')+card('Mis cuentas','<p class=\"muted\">Registra dónde está tu dinero y mantén cada saldo actualizado.</p>'+st.accounts.map(function(a,i){return '<div class=\"row\"><span><b>'+esc(a.name)+'</b><br><span class=\"muted\">'+esc(a.type)+'</span></span><b>$'+Number(a.balance||0).toFixed(2)+'</b></div>'}).join('')+'<form class=\"form\" id=\"accountForm\"><label>Nombre<input name=\"name\" required placeholder=\"Ej. Bancomer\"></label><label>Tipo<select name=\"type\"><option>Nómina</option><option>Débito</option><option>Ahorro</option><option>Crédito</option><option>Efectivo</option><option>Billetera digital</option><option>Otro</option></select></label><label>Saldo inicial<input name=\"balance\" type=\"number\" step=\"0.01\" required placeholder=\"0.00\"></label><button class=\"btn\">Agregar cuenta</button></form>','full')+'</div>'}else if(st.page=='metas'){var gs='';st.goals.forEach(function(g,i){var kind=g.type=='financial'?'Financiera':g.type=='count'?'De conteo':'De progreso';var val=g.type=='financial'?'$'+(g.current||0)+' / $'+(g.target||0):(g.type=='count'?(g.current||0)+' / '+(g.target||0)+' '+(g.unit||'unidades'):((g.progress||0)+'%'));gs+='<div class=\"goal\"><div class=\"goalhead\"><div><div class=\"goalname\">'+esc(g.name)+'</div><div class=\"goalmeta\"><span class=\"pill\">'+kind+'</span><span class=\"pill\">'+(g.status||'Activa')+'</span><span class=\"pill\">Prioridad '+(g.priority||'Media')+'</span></div></div><b>'+val+'</b></div><div class=\"progress\"><b style=\"width:'+(g.progress||0)+'%\"></b></div><div class=\"goaldate\">'+(g.start||'Sin fecha de inicio')+' · '+(g.deadline||'Sin fecha límite')+'</div><button class=\"btn secondary\" data-goal=\"'+i+'\">Agregar avance</button> <button class=\"btn danger\" data-delete-goal=\"'+i+'\">Eliminar</button></div>'});v='<div class=\"grid\">'+card('Mis metas','<p class=\"muted\">Define qué quieres lograr y mide avances reales.</p>'+gs+'<form class=\"form goalform\" id=\"goalForm\"><h3>Nueva meta</h3><div class=\"goalgrid\"><label>Nombre<input name=\"name\" required placeholder=\"Ej. Ahorrar para vacaciones\"></label><label>Tipo<select name=\"type\"><option value=\"progress\">De progreso</option><option value=\"financial\">Financiera</option><option value=\"count\">De conteo</option></select></label><label>Prioridad<select name=\"priority\"><option>Alta</option><option selected>Media</option><option>Baja</option></select></label><label>Estado<select name=\"status\"><option>Activa</option><option>En pausa</option><option>Completada</option><option>Archivada</option></select></label><label>Fecha de inicio<input name=\"start\" type=\"date\"></label><label>Fecha límite<input name=\"deadline\" type=\"date\"></label><label>Objetivo<input name=\"target\" type=\"number\" min=\"0\" step=\"0.01\" placeholder=\"Ej. 10000\"></label><label>Unidad<input name=\"unit\" placeholder=\"pesos, sesiones, libros…\"></label></div><button class=\"btn\">Crear meta</button></form>','full')+'</div>'}else if(st.page=='salud'){v='<div class="grid">'+card('Salud mental','<p class="muted">Un espacio breve para escucharte, sin juicio.</p><form class="form" id="moodForm"><label>¿Cómo estuvo tu día?<select name="mood"><option>✨ Muy bien</option><option>🙂 Bien</option><option>😐 Neutro</option><option>🌧️ Difícil</option></select></label><label>Una frase corta<textarea name="detail" required placeholder="Hoy me sentí…"></textarea></label><button class="btn">Guardar check-in</button></form>','full')+'</div>'}else if(st.page=='entrenamiento'){v='<div class="grid">'+card('Movimiento de hoy','<p><b>Sesión libre · 20 min</b></p><p class="muted">Registra cuando termines.</p><button class="btn" data-session>Guardar sesión completada</button>','full')+card('Esta semana','<div class="stat">'+st.sessions.length+' sesiones</div><div class="progress"><b style="width:'+Math.min(100,st.sessions.length*33)+'%"></b></div>','third')+'</div>'}else if(st.page=='historial'){var h='';st.expenses.forEach(function(e){h+='<div class="row"><span class="pill">Gasto</span><span>$'+Number(e.amount).toFixed(2)+' · '+esc(e.detail)+'</span></div>'});st.moods.forEach(function(m){h+='<div class="row"><span class="pill">Ánimo</span><span>'+esc(m.mood)+' · '+esc(m.detail)+'</span></div>'});st.sessions.forEach(function(){h+='<div class="row"><span class="pill">Entrenamiento</span><span>Sesión completada</span></div>'});v='<div class="grid">'+card('Historial',h||'<div class="empty">Todavía no hay registros.</div>','full')+'</div>'}document.getElementById('view').innerHTML=v}document.addEventListener('click',function(e){var p=e.target.closest('[data-page]');if(p){st.page=p.getAttribute('data-page');save();render()}var h=e.target.closest('[data-habit]');if(h){var hi=+h.getAttribute('data-habit'),hh=st.habits[hi],isDone=hh.doneDate==dayKey()||(hh.done===true&&!hh.doneDate);if(isDone){hh.doneDate='';hh.done=false;if(hh.history)hh.history=hh.history.filter(function(x){return x!=dayKey()})}else{hh.doneDate=dayKey();hh.done=true;hh.history=hh.history||[];if(hh.history.indexOf(dayKey())<0)hh.history.push(dayKey())}save();render()}var eh=e.target.closest('[data-edit-habit]');if(eh){var ei=+eh.getAttribute('data-edit-habit'),en=prompt('Nombre del hábito',st.habits[ei].name);if(en!==null&&en.trim()){st.habits[ei].name=en.trim();save();render()}}var dh=e.target.closest('[data-delete-habit]');if(dh){var di=+dh.getAttribute('data-delete-habit');if(confirm('¿Eliminar este hábito?')){st.habits.splice(di,1);save();render()}}var g=e.target.closest('[data-goal]');if(g){var gi=+g.getAttribute('data-goal'),go=st.goals[gi],amount=prompt(go.type=='financial'?'¿Cuánto dinero agregas?':go.type=='count'?'¿Cuántas unidades agregas?':'¿Qué porcentaje de avance agregas?','10');if(amount!==null&&amount!==''&&!isNaN(amount)){if(go.type=='financial'||go.type=='count'){go.current=Number(go.current||0)+Number(amount);go.progress=go.target?Math.min(100,Math.round(go.current/go.target*100)):0}else go.progress=Math.min(100,Number(go.progress||0)+Number(amount));if(go.progress>=100)go.status='Completada';save();render()}}var cr=e.target.closest('[data-confirm-recurring]');if(cr){var ri=+cr.getAttribute('data-confirm-recurring'),rr=st.recurring[ri],pick=document.querySelector('[data-recurring-account=\"'+ri+'\"]'),sel=pick?pick.value:'';if(sel!==''&&st.accounts[+sel]){var ca=st.accounts[+sel];ca.balance+=rr.type=='income'?Number(rr.amount):-Number(rr.amount);st.expenses.push(Object.assign({},rr,{account:+sel,recurrence:'recurrente',date:Date.now()}));rr.lastMonth=monthKey();save();render()}}var dg=e.target.closest('[data-delete-goal]');if(dg){var di=+dg.getAttribute('data-delete-goal');if(confirm('¿Eliminar esta meta? Esta acción no se puede deshacer.')){st.goals.splice(di,1);save();render()}}var ee=e.target.closest('[data-edit-expense]');if(ee){var ei=+ee.getAttribute('data-edit-expense'),em=st.expenses[ei],nv=prompt('Nuevo monto',String(em.amount));if(nv!==null&&!isNaN(nv)&&Number(nv)>=0){var ea=st.accounts[em.account];if(ea)ea.balance+=em.type=='income'?Number(em.amount)-Number(nv):Number(em.amount)-Number(nv);em.amount=Number(nv);save();render()}}var de=e.target.closest('[data-delete-expense]');if(de){var xi=+de.getAttribute('data-delete-expense'),xm=st.expenses[xi],xa=st.accounts[xm.account];if(confirm('¿Eliminar este movimiento?')){if(xa)xa.balance+=xm.type=='income'?-Number(xm.amount):Number(xm.amount);st.expenses.splice(xi,1);save();render()}}if(e.target.hasAttribute('data-session')){st.sessions.push({date:Date.now()});save();render()}});document.addEventListener('submit',function(e){e.preventDefault();var f=e.target,d=new FormData(f);if(f.id=='goalForm')st.goals.push({name:d.get('name'),type:d.get('type'),start:d.get('start'),deadline:d.get('deadline'),target:Number(d.get('target')||0),current:0,unit:d.get('unit'),progress:0,priority:d.get('priority')||'Media',status:d.get('status')||'Activa'});if(f.id=='habitForm')st.habits.push({name:d.get('name'),done:false,doneDate:'',history:[]});if(f.id=='accountForm')st.accounts.push({name:d.get('name'),type:d.get('type'),balance:Number(d.get('balance')||0)});if(f.id=='expenseForm'){var ai=Number(d.get('account')),amt=Number(d.get('amount')||0),ac=st.accounts[ai],mv={type:d.get('type'),amount:amt,category:d.get('category'),group:d.get('group'),detail:d.get('detail'),account:ai,recurrence:d.get('recurrence')||'unico',payday:d.get('payday')||'',date:d.get('date')||Date.now()};if(ac){if(mv.recurrence=='recurrente')st.recurring.push(mv);else{ac.balance+=mv.type=='income'?amt:-amt;st.expenses.push(mv)}}}if(f.id=='moodForm')st.moods.push({mood:d.get('mood'),detail:d.get('detail'),date:Date.now()});if(f.id=='quickForm'){if(d.get('type')=='expense')st.expenses.push({amount:d.get('amount')||0,detail:d.get('detail'),date:Date.now()});else if(d.get('type')=='mood')st.moods.push({mood:'📝 Nota',detail:d.get('detail'),date:Date.now()});else st.sessions.push({date:Date.now()})}save();render()});document.getElementById('date').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});render();</script></body></html>
