<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#005252">
<title>mi día · prototipo</title>
<style>
:root{--ink:#35425F;--deep:#005252;--cream:#FFF5F2;--gold:#F0A019;--rose:#DD8582;--sage:#D8E2DB;--lilac:#D2BABB;--sand:#D8CBAA;--blue:#08738D;--white:#fff;--shadow:0 12px 30px #35425f16;--radius:22px}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex;max-width:1500px;margin:auto}.sidebar{width:260px;background:var(--deep);color:white;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:29px;font-weight:800;letter-spacing:-1px;padding:4px 13px 28px}.brand span{color:var(--gold)}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#d9ece6;text-align:left;padding:12px 14px;border-radius:13px;font-weight:650;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff1c;color:#fff}.nav .ico{font-size:20px;width:24px;text-align:center}.preview{margin-top:auto;color:#c9ddd8;font-size:12px;line-height:1.45;padding:15px 13px;background:#ffffff12;border-radius:15px}.preview b{color:var(--gold)}main{flex:1;padding:34px clamp(20px,4vw,62px);max-width:1100px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.eyebrow{font-size:13px;font-weight:750;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}.top h1{margin:5px 0 0;font-size:clamp(27px,4vw,42px);letter-spacing:-1.6px}.avatar{background:var(--gold);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--deep)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:white;border-radius:var(--radius);padding:23px;box-shadow:var(--shadow);grid-column:span 6}.card.full{grid-column:1/-1}.card.third{grid-column:span 4}.card h2,.card h3{margin:0 0 8px}.card h2{font-size:20px}.card h3{font-size:16px}.muted{color:#687389;font-size:14px}.hero{background:var(--deep);color:#fff;grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:22px;overflow:hidden}.hero p{color:#d7ebe4;margin:5px 0 0}.hero .sun{font-size:75px;line-height:1;color:var(--gold)}.progress{height:9px;background:var(--sage);border-radius:99px;overflow:hidden;margin:15px 0 10px}.progress i{height:100%;display:block;background:var(--gold);border-radius:inherit}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.stack{display:grid;gap:12px}.item{padding:13px 0;border-bottom:1px solid #e9edf0}.item:last-child{border-bottom:0}.check{width:30px;height:30px;border-radius:10px;background:var(--sage);color:var(--deep);font-weight:900;flex:none}.check.done{background:var(--deep);color:white}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:750;background:var(--sage);color:var(--deep)}.pill.gold{background:#fff0d2;color:#885600}.pill.rose{background:#f8dddd;color:#8b4847}.btn{padding:11px 16px;border-radius:12px;font-weight:750;background:var(--deep);color:#fff;min-height:44px}.btn.secondary{background:var(--sage);color:var(--deep)}.btn.outline{background:transparent;border:1px solid #bbc7cd;color:var(--deep)}.btn.small{padding:8px 11px;min-height:36px;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.stat{font-size:30px;font-weight:800;color:var(--deep);margin:6px 0}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:750}.form input,.form select,.form textarea{width:100%;border:1px solid #cbd5d8;border-radius:11px;padding:12px;color:var(--ink);background:#fff}.form textarea{min-height:90px;resize:vertical}.empty{text-align:center;padding:28px 10px;color:#687389}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:5;opacity:0;transform:translateY(12px);transition:.25s}.toast.show{opacity:1;transform:none}.mobile-nav{display:none}.metric{display:flex;align-items:center;gap:13px}.metric b{font-size:15px}.dot{width:13px;height:13px;border-radius:50%;background:var(--gold)}.dot.blue{background:var(--blue)}.dot.rose{background:var(--rose)}@media(max-width:760px){.app{display:block}.sidebar{display:none}main{padding:23px 16px 92px}.top{margin-bottom:21px}.card,.card.third{grid-column:1/-1;padding:19px}.hero{align-items:flex-start}.hero .sun{font-size:54px}.mobile-nav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 22px #35425f18}.mobile-nav button{background:none;color:#687389;font-size:10px;font-weight:700;padding:4px 7px}.mobile-nav button.active{color:var(--deep)}.mobile-nav .ico{font-size:20px;display:block}.top h1{font-size:30px}}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#005252"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi día"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head>
<body><div class="app"><aside class="sidebar"><div class="brand">mi <span>día</span></div><nav class="nav" id="nav"></nav><div class="preview"><b>Vista previa</b><br>Demo local sin backend ni autenticación. Tus cambios se guardan sólo en este dispositivo.</div></aside><main><header class="top"><div><div class="eyebrow">lunes, 31 de agosto</div><h1 id="title">Hola, Marco <span aria-hidden="true">👋</span></h1></div><div class="avatar" aria-label="Perfil de Marco">MV</div></header><section id="view"></section></main></div><nav class="mobile-nav" id="mobileNav"></nav><div class="toast" id="toast" role="status"></div>
<script>
const pages=[['hoy','☀️','Hoy'],['registrar','✍️','Registrar'],['hábitos','✓','Hábitos'],['entrenamiento','🏋️','Entrenamiento'],['finanzas','◈','Finanzas'],['salud','♡','Salud mental'],['metas','◎','Metas'],['historial','▤','Historial'],['config','⚙','Configuración']];
let state=JSON.parse(localStorage.getItem('mi-dia-demo')||'null')||{page:'hoy',habits:[{name:'Tomar agua',done:true},{name:'Caminar 6,000 pasos',done:false},{name:'Pausa consciente',done:false}],moods:[],expenses:[],goals:[{name:'Moverme con constancia',progress:42}],workouts:[]};
const save=()=>localStorage.setItem('mi-dia-demo',JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function nav(){let html=pages.map(p=>`<button class="${state.page===p[0]?'active':''}" data-page="${p[0]}"><span class="ico">${p[1]}</span>${p[2]}</button>`).join('');document.querySelector('#nav').innerHTML=html;document.querySelector('#mobileNav').innerHTML=pages.slice(0,5).map(p=>`<button class="${state.page===p[0]?'active':''}" data-page="${p[0]}"><span class="ico">${p[1]}</span>${p[2]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();render()})}
const card=(title,body,cls='')=>`<article class="card ${cls}"><h2>${title}</h2>${body}</article>`;
function render(){nav();let v=document.querySelector('#view');v.innerHTML=views[state.page]?.()||views.hoy();document.querySelectorAll('[data-action]').forEach(x=>x.onclick=actions);}
const views={
hoy:()=>`<div class="grid"><article class="card hero"><div><div class="eyebrow" style="color:#f0a019">Tu resumen</div><h2 style="font-size:27px;margin:8px 0 0">Un paso a la vez</h2><p>Hoy tienes ${state.habits.filter(x=>!x.done).length} hábitos por completar.</p></div><div class="sun">☀</div></article>${card('Hábitos de hoy',`<div class="stack">${state.habits.slice(0,3).map((h,i)=>`<div class="row item"><div class="metric"><button class="check ${h.done?'done':''}" data-action="habit" data-i="${i}" aria-label="${h.done?'Desmarcar':'Completar'} ${esc(h.name)}">${h.done?'✓':''}</button><b>${esc(h.name)}</b></div><span class="pill ${h.done?'':'gold'}">${h.done?'Listo':'Pendiente'}</span></div>`).join('')}</div><div class="actions"><button class="btn secondary small" data-page="hábitos">Ver hábitos</button></div>`,'full'),card('Tu energía',`<div class="stat">${state.moods.length?'Registrada':'¿Cómo te sientes?'}</div><p class="muted">Tomarte un minuto también cuenta.</p><button class="btn outline small" data-page="salud">Registrar estado</button>`,'third'),card('Próximo movimiento',`<div class="metric"><span class="dot blue"></span><div><b>Sesión libre</b><br><span class="muted">Elige cuándo moverte hoy</span></div></div><div class="actions"><button class="btn small" data-page="entrenamiento">Ver entrenamiento</button></div>`,'third'),card('Meta en foco',`<div class="stat">42%</div><div class="progress"><i style="width:42%"></i></div><span class="muted">Moverme con constancia</span>`,'third')}</div>`,
registrar:()=>`<div class="grid">${card('Registrar algo nuevo',`<form class="form" id="logForm"><label>¿Qué quieres registrar?<select name="type"><option value="mood">Estado de ánimo</option><option value="expense">Gasto</option><option value="workout">Entrenamiento</option></select></label><label>Detalle<input name="detail" required placeholder="Escribe una nota breve…"></label><button class="btn">Guardar registro</button></form>`,'full'),card('Último registro',state.moods.length?`<p>${esc(state.moods.at(-1).detail)}</p><span class="pill">Hoy</span>`:`<div class="empty">📝<strong>Aún no hay registros</strong>Empieza con algo pequeño.`)}</div>`,
hábitos:()=>`<div class="grid">${card('Mis hábitos',`<p class="muted">Pequeñas acciones, días más tuyos.</p><div class="stack">${state.habits.map((h,i)=>`<div class="row item"><div class="metric"><button class="check ${h.done?'done':''}" data-action="habit" data-i="${i}">${h.done?'✓':''}</button><span>${esc(h.name)}</span></div><button class="btn outline small" data-action="removeHabit" data-i="${i}">Quitar</button></div>`).join('')}</div><form class="actions" id="habitForm"><input name="name" aria-label="Nuevo hábito" placeholder="Añadir hábito…" required><button class="btn small">Añadir</button></form>`,'full'),card('Racha',`<div class="stat">${state.habits.filter(x=>x.done).length}/3</div><span class="muted">completados hoy</span>`,'third'),card('Tip amable',`<p>La constancia no tiene que ser perfecta. Retomar también es avanzar. 🌱</p>`,'third')}</div>`,
entrenamiento:()=>`<div class="grid">${card('Movimiento de hoy',`<div class="metric"><span class="dot blue"></span><div><b>Sesión suave · 20 min</b><br><span class="muted">Movilidad y fuerza funcional</span></div></div><div class="actions"><button class="btn" data-action="workout">Marcar como hecha</button><button class="btn secondary" data-action="toast">Cambiar sesión</button></div>`,'full'),card('Esta semana',`<div class="stat">${state.workouts.length} sesiones</div><div class="progress"><i style="width:${Math.min(100,state.workouts.length*33)}%"></i></div><span class="muted">Objetivo: 3 sesiones</span>`,'third'),card('Escucha a tu cuerpo',`<p class="muted">Si algo duele o tienes una condición médica, pausa y consulta a un profesional de la salud.</p>`,'third')}</div>`,
finanzas:()=>`<div class="grid">${card('Finanzas',`<div class="stat">$0.00</div><span class="muted">gastos registrados este mes</span><div class="actions"><button class="btn" data-page="registrar">Registrar gasto</button></div>`,'full'),card('Sin movimientos todavía',`<div class="empty">💳<strong>Todo tranquilo por aquí</strong>Registra un gasto para empezar a ver tu panorama.`),'third')}</div>`,
salud:()=>`<div class="grid">${card('Salud mental',`<p class="muted">Un espacio breve para escucharte, sin juicio.</p><form class="form" id="moodForm"><label>¿Cómo estuvo tu día?<select name="mood"><option>✨ Muy bien</option><option>🙂 Bien</option><option>😐 Neutro</option><option>🌧️ Difícil</option></select></label><label>Una frase corta<textarea name="detail" required placeholder="Hoy me sentí…"></textarea></label><button class="btn">Guardar check-in</button></form>`,'full'),card('Tu historial emocional',state.moods.length?state.moods.slice(-3).reverse().map(x=>`<div class="item"><b>${esc(x.mood)}</b><br><span class="muted">${esc(x.detail)}</span></div>`).join(''):`<div class="empty">♡<strong>Tu espacio está listo</strong>Cuando quieras, cuéntame cómo estás.`),'third')}</div>`,
metas:()=>`<div class="grid">${card('Metas',`<div class="stack">${state.goals.map((g,i)=>`<div class="item"><div class="row"><b>${esc(g.name)}</b><span class="pill gold">${g.progress}%</span></div><div class="progress"><i style="width:${g.progress}%"></i></div><button class="btn secondary small" data-action="goal" data-i="${i}">+ avanzar</button></div>`).join('')}</div><form class="actions" id="goalForm"><input name="name" placeholder="Nueva meta…" required><button class="btn small">Crear meta</button></form>`,'full')}</div>`,
historial:()=>`<div class="grid">${card('Historial',`<p class="muted">Tus registros aparecen aquí, guardados localmente.</p>${[...state.moods.map(x=>({t:'Ánimo',d:x.detail})),...state.workouts.map(x=>({t:'Entrenamiento',d:'Sesión suave completada'}))].length? [...state.moods.map(x=>({t:'Ánimo',d:x.detail})),...state.workouts.map(x=>({t:'Entrenamiento',d:'Sesión suave completada'}))].reverse().map(x=>`<div class="item"><span class="pill">${x.t}</span> ${esc(x.d)}</div>`).join(''):`<div class="empty">▤<strong>Tu historial está vacío</strong>Lo que registres vivirá aquí.`}`,'full')}</div>`,
config:()=>`<div class="grid">${card('Configuración',`<div class="stack"><div class="row item"><div><b>Perfil</b><br><span class="muted">Marco Vazquez Nuñez</span></div><button class="btn outline small" data-action="toast">Editar</button></div><div class="row item"><div><b>Recordatorios</b><br><span class="muted">Gestiona tus avisos</span></div><button class="btn secondary small" data-action="toast">Activar</button></div><div class="row item"><div><b>Datos de demo</b><br><span class="muted">Se guardan en localStorage</span></div><button class="btn outline small" data-action="reset">Borrar</button></div></div>`,'full')}</div>`};
function actions(e){let el=e.currentTarget,a=el.dataset.action,i=+el.dataset.i;if(a==='habit'){state.habits[i].done=!state.habits[i].done;save();render();toast('¡Buen trabajo!')}if(a==='removeHabit'){state.habits.splice(i,1);save();render();toast('Hábito eliminado')}if(a==='goal'){state.goals[i].progress=Math.min(100,state.goals[i].progress+10);save();render();toast('Meta actualizada')}if(a==='workout'){state.workouts.push({date:Date.now()});save();render();toast('Sesión guardada')}if(a==='reset'&&confirm('¿Borrar los datos de demo?')){localStorage.removeItem('mi-dia-demo');location.reload()}if(a==='toast')toast('Disponible en la próxima versión')}
function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){state.page=b.dataset.page;save();render()}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='habitForm'){state.habits.push({name:d.get('name'),done:false});toast('Hábito añadido')}if(f.id==='goalForm'){state.goals.push({name:d.get('name'),progress:0});toast('Meta creada')}if(f.id==='moodForm'){state.moods.push({mood:d.get('mood'),detail:d.get('detail'),date:Date.now()});toast('Gracias por compartirlo')}if(f.id==='logForm'){let type=d.get('type');if(type==='mood')state.moods.push({mood:'📝 Nota',detail:d.get('detail'),date:Date.now()});if(type==='workout')state.workouts.push({date:Date.now()});toast('Registro guardado')}save();render()});render();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script></body></html>
